<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario GUARD-IA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="app-loader" class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-[2000]">
        <div class="text-white text-xl flex flex-col items-center gap-4">
            <i class="fas fa-spinner fa-spin text-4xl" style="color: var(--accent-primary)"></i>
            <span>Cargando sistema...</span>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-gray-900 border border-green-500/50 flex items-center justify-center shadow-[0_0_10px_rgba(74,222,128,0.2)]">
                    <i class="fas fa-robot text-green-400 text-xl"></i>
                </div>
                <h2 class="text-lg font-bold tracking-tight text-white">GUARD-IA <span class="text-xs text-green-400 font-normal border border-green-500/30 rounded px-1 ml-1">Pro</span></h2>
            </div>
            <button id="closeSidebarBtn" class="btn-icon btn-secondary" style="width:32px;height:32px"><i class="fas fa-times"></i></button>
        </div>

        <div class="sidebar-content">
            
            <div class="sidebar-section">
                <h3 class="sidebar-section-title"><i class="fas fa-calendar-alt mr-2"></i> Mis Calendarios</h3>
                
                <div class="relative mb-3">
                    <select id="calendarSelector" class="form-select w-full font-bold" style="padding-left:2.5rem">
                        <option value="default">Mi Calendario</option>
                    </select>
                    <i class="fas fa-check-circle absolute left-3 top-3.5 text-green-500"></i>
                </div>

                <div class="flex gap-1 mb-1">
                    <input type="text" id="newCalendarName" class="form-input" placeholder="Nombre nuevo..." style="border-radius: 0.5rem 0 0 0.5rem; font-size:0.85rem">
                    <button id="addCalendarBtn" class="btn btn-primary" style="border-radius: 0 0.5rem 0.5rem 0; padding:0 1rem">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
            
            <div class="sidebar-section">
                <h3 class="sidebar-section-title" style="color: #fbbf24;"><i class="fas fa-star mr-2"></i> Herramientas Pro</h3>
                
                <button id="btnStats" class="btn btn-secondary w-full flex-col gap-1 py-3 h-auto mb-2">
                    <i class="fas fa-chart-pie text-2xl" style="color: #fbbf24;"></i>
                    <span class="text-xs font-bold">Ver Estadísticas</span>
                </button>

                <div class="flex gap-2">
                    <button id="btnExportIcs" class="btn btn-secondary flex-1 text-xs">
                        <i class="fas fa-file-export" style="color: #a78bfa;"></i> Exportar ICS
                    </button>
                    <button id="btnImportIcs" class="btn btn-secondary flex-1 text-xs">
                        <i class="fas fa-file-import" style="color: #10b981;"></i> Importar ICS
                    </button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-section-title"><i class="fas fa-cog mr-2"></i> Configuración</h3>
                
                <button id="manageCustomShiftsBtn" class="btn btn-secondary w-full justify-start mb-2">
                    <i class="fas fa-palette w-6 text-center" style="color: #34d399;"></i> 
                    <span>Personalizar Colores/Turnos</span>
                </button>

                <button id="manageCyclesBtn" class="btn btn-secondary w-full justify-start mb-2">
                    <i class="fas fa-sync w-6 text-center" style="color: #60a5fa;"></i>
                    <span>Configurar Patrones/Ciclos</span>
                </button>

                <button id="helpBtn" class="btn btn-secondary w-full justify-start mt-2">
                    <i class="fas fa-question-circle w-6 text-center text-gray-400"></i>
                    <span>Ayuda y Tutorial</span>
                </button>
                
                <a href="https://onefrai.github.io/guard-ia-app/" target="_top" class="btn btn-secondary w-full justify-start mt-2">
                    <i class="fas fa-arrow-left w-6 text-center text-gray-400"></i>
                    <span>Salir / Volver</span>
                </a>
            </div>

            <div class="mt-8 pt-4 border-t border-gray-800 opacity-80 hover:opacity-100 transition-opacity">
                <h3 class="sidebar-section-title text-red-900"><i class="fas fa-exclamation-triangle mr-2"></i> Zona de Peligro</h3>
                <div class="flex gap-2">
                    <button id="clearAllShiftsBtn" class="btn btn-danger flex-1 text-xs py-2" style="background:rgba(239, 68, 68, 0.15); border:1px solid rgba(239, 68, 68, 0.3); color:#fca5a5">
                        <i class="fas fa-eraser"></i> Limpiar Calendario
                    </button>
                    <button id="deleteCalendarBtn" class="btn btn-danger flex-1 text-xs py-2" style="background:rgba(239, 68, 68, 0.15); border:1px solid rgba(239, 68, 68, 0.3); color:#fca5a5">
                        <i class="fas fa-trash"></i> Borrar Cal.
                    </button>
                </div>
            </div>

        </div>
    </aside>

    <div id="app-content" class="hidden">
 <header class="mobile-header">
            <button id="hamburgerBtn" class="hamburger-btn"><i class="fas fa-bars"></i></button>
            
            <div class="flex items-center justify-center gap-1 flex-1">
                <button id="prevMonth" class="btn-icon btn-secondary" style="width:32px; height:32px; min-width:32px">
                    <i class="fas fa-chevron-left text-xs"></i>
                </button>
                
                <div class="date-selector-container" style="flex: 0 1 auto; margin:0 4px">
                    <button id="datePickerBtn" class="date-picker-btn" style="padding: 0.4rem 0.8rem;">
                        <span id="calendarTitle" class="whitespace-nowrap text-sm">Noviembre 2025</span>
                        <i class="fas fa-chevron-down text-xs ml-1"></i>
                    </button>
                </div>
                
                <button id="nextMonth" class="btn-icon btn-secondary" style="width:32px; height:32px; min-width:32px">
                    <i class="fas fa-chevron-right text-xs"></i>
                </button>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="themeToggleBtn" class="btn-icon btn-secondary" style="width:32px; height:32px"><i class="fas fa-moon text-xs"></i></button>
                <button id="todayBtn" class="btn btn-primary text-xs px-3 py-1" style="height:32px">Hoy</button>
            </div>
        </header>
        <main id="mainCaptureArea">
            <section id="mainCalendarArea" class="hidden">
                <div class="calendar-weekdays">
                    <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
                
                <div id="notesHistory" class="notes-history"></div>
            </section>
        </main>
        <button id="fabEditBtn" class="fab-button hidden"><i class="fas fa-edit"></i></button>
        
        <div id="floatingEditPanel" class="floating-edit-panel">
            <div class="flex justify-between items-center mb-2 panel-header">
                <h3 class="text-base font-bold">Editar Turnos (Añada a mano los turnos que precise)</h3>
                <button id="closeEditPanelBtn" class="btn-icon btn-secondary"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="shiftsTab" class="block">
                <div class="compact-edit-grid">
                    <div class="turno-buttons-row-1" id="shiftSelector"></div>
                    <div class="turno-buttons-row-2">
                        <button class="turno-btn btn-borrar" data-shift-type="erase">
                            <i class="fas fa-eraser"></i> Borrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <div id="modal-container"></div>
    <script src="script.js"></script>
</body>
</html>

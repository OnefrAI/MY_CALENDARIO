<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario GUARD-IA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librerías PRO para Estadísticas y Exportación -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="app-loader" class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-[2000]">
        <div class="text-white text-xl flex flex-col items-center gap-4">
            <i class="fas fa-spinner fa-spin text-4xl" style="color: var(--accent-primary)"></i>
            <span>Cargando sistema...</span>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2 class="text-lg font-bold">Menu</h2>
            <button id="closeSidebarBtn" class="btn-icon btn-secondary"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Calendarios</h3>
                <select id="calendarSelector" class="form-select mb-3">
                    <option value="default">Mi Calendario</option>
                </select>
                <input type="text" id="newCalendarName" class="form-input mb-3" placeholder="Nombre nuevo calendario">
                <div class="flex gap-2">
                    <button id="addCalendarBtn" class="btn btn-primary flex-1">
                        <i class="fas fa-plus"></i> Crear
                    </button>
                    <button id="deleteCalendarBtn" class="btn btn-danger flex-1">
                        <i class="fas fa-trash-alt"></i> Borrar
                    </button>
                </div>
            </div>
            
            <!-- NUEVA SECCIÓN: HERRAMIENTAS PRO -->
            <div class="sidebar-section">
                <h3 class="sidebar-section-title" style="color: #39FF14;">✨ Herramientas Pro</h3>
                <button id="btnStats" class="btn btn-secondary w-full mb-2">
                    <i class="fas fa-chart-pie" style="color: #fbbf24;"></i> Estadísticas
                </button>
                <button id="btnExportImg" class="btn btn-secondary w-full mb-2">
                    <i class="fas fa-camera" style="color: #60a5fa;"></i> Guardar Imagen
                </button>
                <button id="btnExportIcs" class="btn btn-secondary w-full mb-2">
                    <i class="fas fa-file-export" style="color: #a78bfa;"></i> Exportar .ICS
                </button>
            </div>
            
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Turnos</h3>
                <button id="manageCustomShiftsBtn" class="btn btn-primary w-full mb-3">
                    <i class="fas fa-palette"></i> Mis Turnos
                </button>
                <button id="manageCyclesBtn" class="btn btn-primary w-full mb-3">
                    <i class="fas fa-sync"></i> Mis Ciclos
                </button>
                <button id="clearAllShiftsBtn" class="btn btn-danger w-full">
                    <i class="fas fa-broom"></i> Limpiar Todo
                </button>
            </div>
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Apariencia</h3>
                <button id="themeToggleBtn" class="btn btn-secondary w-full"></button>
            </div>
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Ayuda</h3>
                <button id="helpBtn" class="btn btn-secondary w-full mb-3">
                    <i class="fas fa-question-circle"></i> Como usar
                </button>
                <a href="https://onefrai.github.io/guard-ia-app/" target="_top" class="btn btn-secondary w-full">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>
        </div>
    </aside>
    <div id="app-content" class="hidden">
        <header class="mobile-header">
            <button id="hamburgerBtn" class="hamburger-btn"><i class="fas fa-bars"></i></button>
            <button id="prevMonth" class="btn-icon btn-secondary"><i class="fas fa-chevron-left"></i></button>
            <h1 class="text-base font-bold flex-1 text-center" id="calendarTitle">Cal</h1>
            <button id="todayBtn" class="btn-icon btn-primary"><i class="fas fa-calendar-day"></i></button>
            <button id="nextMonth" class="btn-icon btn-secondary"><i class="fas fa-chevron-right"></i></button>
        </header>
        <main id="mainCaptureArea">
            <section id="mainCalendarArea" class="hidden">
                <div class="calendar-weekdays">
                    <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
                
                <div id="notesHistory" class="notes-history"></div>
            </section>
        </main>
        <button id="fabEditBtn" class="fab-button hidden"><i class="fas fa-edit"></i></button>
        <div id="floatingEditPanel" class="floating-edit-panel">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-base font-bold">Editar</h3>
                <button id="closeEditPanelBtn" class="btn-icon btn-secondary"><i class="fas fa-times"></i></button>
            </div>
            <div class="compact-edit-grid">
                <div class="turno-buttons-row-1" id="shiftSelector"></div>
                <div class="turno-buttons-row-2">
                    <button class="turno-btn btn-borrar" data-shift-type="erase"><i class="fas fa-eraser"></i> Borrar</button>
                </div>
            </div>
        </div>
    </div>
    <div id="modal-container"></div>
    <script src="script.js"></script>
</body>
</html>

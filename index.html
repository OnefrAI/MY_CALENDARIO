<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario del GUARD-IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="app-loader" class="fixed inset-0 bg-gray-900 bg-opacity-90 flex items-center justify-center z-[2000]">
        <div class="text-white text-xl flex flex-col items-center gap-4">
            <i class="fas fa-spinner fa-spin text-4xl" style="color: var(--accent-primary)"></i>
            <span>Cargando...</span>
        </div>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2 class="text-lg font-bold">Menu</h2>
            <button id="closeSidebarBtn" class="btn-icon btn-secondary"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-section">
                <button id="themeToggleBtn" class="btn btn-secondary w-full"></button>
            </div>
            <div class="sidebar-section">
                <a href="https://onefrai.github.io/guard-ia-app/" target="_top" class="btn btn-secondary w-full">
                    <i class="fas fa-arrow-left"></i> Volver
                </a>
            </div>
        </div>
    </aside>
    <div id="app-content" class="hidden">
        <header class="mobile-header">
            <button id="hamburgerBtn" class="hamburger-btn"><i class="fas fa-bars"></i></button>
            <button id="prevMonth" class="btn-icon btn-secondary"><i class="fas fa-chevron-left"></i></button>
            <h1 class="text-base font-bold flex-1 text-center" id="calendarTitle">Cal</h1>
            <button id="todayBtn" class="btn-icon btn-primary"><i class="fas fa-calendar-day"></i></button>
            <button id="nextMonth" class="btn-icon btn-secondary"><i class="fas fa-chevron-right"></i></button>
        </header>
        <main>
            <section id="mainCalendarArea" class="hidden">
                <div class="calendar-weekdays">
                    <div>S</div><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </section>
        </main>
        <button id="fabEditBtn" class="fab-button hidden"><i class="fas fa-edit"></i></button>
        <div id="floatingEditPanel" class="floating-edit-panel">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-base font-bold">Editar</h3>
                <button id="closeEditPanelBtn" class="btn-icon btn-secondary"><i class="fas fa-times"></i></button>
            </div>
            <div class="compact-edit-grid">
                <div class="turno-buttons-row-1" id="shiftSelector"></div>
                <div class="turno-buttons-row-2">
                    <button class="turno-btn btn-borrar" data-shift-type="erase"><i class="fas fa-eraser"></i> Borrar</button>
                </div>
            </div>
        </div>
    </div>
    <div id="modal-container"></div>
    <script src="script.js"></script>
</body>
</html>
